<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JDM & Euro Custom Garage</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        /* 메인 레이아웃 */
        #sidebar { width: 320px; background: #1e1e1e; padding: 20px; display: flex; flex-direction: column; gap: 20px; z-index: 10; border-right: 2px solid #333; }
        #canvas-container { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #000; }
        canvas { border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }

        h2 { font-size: 1.2rem; color: #ff3e3e; text-transform: uppercase; border-bottom: 2px solid #ff3e3e; padding-bottom: 5px; margin-bottom: 10px; }
        
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.9rem; color: #aaa; }
        select, input[type="color"] { width: 100%; padding: 8px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; outline: none; }
        
        /* 스탯 파트 */
        .stat-box { background: #252525; padding: 12px; border-radius: 6px; }
        .stat-line { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.85rem; }
        .stat-bar { height: 6px; background: #444; border-radius: 3px; overflow: hidden; }
        .stat-fill { height: 100%; background: #ff3e3e; width: 0%; transition: width 0.3s; }

        .btn { padding: 12px; background: #ff3e3e; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn:hover { background: #e03232; }
    </style>
</head>
<body>

<div id="sidebar">
    <h1>GARAGE</h1>
    
    <!-- 차량 선택 -->
    <div class="control-group">
        <h2>1. 차량 선택</h2>
        <select id="carSelect">
            <option value="e30">BMW M3 (E30)</option>
            <option value="e36">BMW M3 (E36)</option>
            <option value="r34">Nissan GT-R (R34)</option>
            <option value="r35">Nissan GT-R (R35)</option>
            <option value="s13">Nissan Silvia (S13)</option>
            <option value="s14">Nissan Silvia (S14)</option>
            <option value="s15">Nissan Silvia (S15)</option>
        </select>
    </div>

    <!-- 커스텀 (외관) -->
    <div class="control-group">
        <h2>2. 드레스업</h2>
        <label>바디 컬러</label>
        <input type="color" id="paintColor" value="#d01010">
        
        <label>바디킷 Style</label>
        <select id="bodyKit">
            <option value="0">순정 (Stock)</option>
            <option value="1">Street Kit (프론트/스포일러)</option>
            <option value="2">Race Widebody (와이드바디+대형 윙)</option>
        </select>
    </div>

    <!-- 성능 튜닝 -->
    <div class="control-group">
        <h2>3. 성능 튜닝</h2>
        <label>터보 차저</label>
        <select id="turboTune">
            <option value="0">순정 NA / 기본 터보</option>
            <option value="1">Stage 1 싱글 터보 (+50 HP)</option>
            <option value="2">Stage 2 트윈 터보 (+120 HP)</option>
            <option value="3">Stage 3 레이싱 빅터보 (+250 HP)</option>
        </select>
    </div>

    <!-- 성능 제원 표시 -->
    <div class="stat-box">
        <div class="stat-line"><span>출력 (Horsepower)</span><span id="hpText">200 HP</span></div>
        <div class="stat-bar"><div id="hpBar" class="stat-fill"></div></div>
        
        <div class="stat-line" style="margin-top: 10px;"><span>최고 속도 (Top Speed)</span><span id="speedText">220 km/h</span></div>
        <div class="stat-bar"><div id="speedBar" class="stat-fill"></div></div>
    </div>
</div>

<div id="canvas-container">
    <canvas id="garageCanvas" width="800" height="450"></canvas>
</div>

<script>
const canvas = document.getElementById('garageCanvas');
const ctx = canvas.getContext('2d');

// 차량 데이터베이스
const carData = {
    e30: { name: "BMW M3 (E30)", baseHp: 200, baseSpeed: 235, bodyType: "box" },
    e36: { name: "BMW M3 (E36)", baseHp: 282, baseSpeed: 250, bodyType: "box-sleek" },
    r34: { name: "Nissan GT-R (R34)", baseHp: 276, baseSpeed: 255, bodyType: "coupe" },
    r35: { name: "Nissan GT-R (R35)", baseHp: 565, baseSpeed: 315, bodyType: "modern" },
    s13: { name: "Nissan Silvia (S13)", baseHp: 202, baseSpeed: 230, bodyType: "coupe-light" },
    s14: { name: "Nissan Silvia (S14)", baseHp: 217, baseSpeed: 235, bodyType: "coupe-round" },
    s15: { name: "Nissan Silvia (S15)", baseHp: 247, baseSpeed: 245, bodyType: "coupe-sharp" }
};

// 현재 설정 상태
let currentCar = 'e30';
let color = '#d01010';
let kit = 0;
let turbo = 0;

// UI 엘리먼트
const carSelect = document.getElementById('carSelect');
const paintColor = document.getElementById('paintColor');
const bodyKit = document.getElementById('bodyKit');
const turboTune = document.getElementById('turboTune');

// 이벤트 리스너 설정
carSelect.addEventListener('change', (e) => { currentCar = e.target.value; update(); });
paintColor.addEventListener('input', (e) => { color = e.target.value; update(); });
bodyKit.addEventListener('change', (e) => { kit = parseInt(e.target.value); update(); });
turboTune.addEventListener('change', (e) => { turbo = parseInt(e.target.value); update(); });

function update() {
    calculateStats();
    drawGarage();
}

function calculateStats() {
    const data = carData[currentCar];
    let addedHp = 0;
    if (turbo === 1) addedHp = 50;
    if (turbo === 2) addedHp = 120;
    if (turbo === 3) addedHp = 250;

    const totalHp = data.baseHp + addedHp;
    const totalSpeed = Math.round(data.baseSpeed + (addedHp * 0.25));

    document.getElementById('hpText').innerText = `${totalHp} HP`;
    document.getElementById('hpBar').style.width = `${Math.min(100, (totalHp / 800) * 100)}%`;

    document.getElementById('speedText').innerText = `${totalSpeed} km/h`;
    document.getElementById('speedBar').style.width = `${Math.min(100, (totalSpeed / 400) * 100)}%`;
}

function drawGarage() {
    // 배경 (정비소 느낌)
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 바닥 격자
    ctx.strokeStyle = '#2c2c2c';
    ctx.lineWidth = 2;
    for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath(); ctx.moveTo(i, 300); ctx.lineTo(i - 100, 450); ctx.stroke();
    }
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 300, canvas.width, 150);

    // 그림자
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.beginPath();
    ctx.ellipse(400, 330, 230, 30, 0, 0, Math.PI * 2);
    ctx.fill();

    // 차 그리기
    drawCar(400, 280);
}

function drawCar(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // 1. 와이드 바디킷 (바탕)
    if (kit === 2) {
        ctx.fillStyle = color;
        // 펜더 휠아치 확장
        ctx.fillRect(-210, 15, 70, 25);
        ctx.fillRect(130, 15, 70, 25);
    }

    // 2. 기본 바디 쉘
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(-200, 0, 390, 40, [10, 15, 5, 5]);
    ctx.fill();

    // 루프 (캐빈)
    ctx.beginPath();
    ctx.moveTo(-100, 0);
    ctx.lineTo(-50, -45);
    ctx.lineTo(80, -45);
    ctx.lineTo(130, 0);
    ctx.closePath();
    ctx.fill();

    // 3. 창문
    ctx.fillStyle = '#111520';
    ctx.beginPath();
    ctx.moveTo(-90, -3);
    ctx.lineTo(-45, -40);
    ctx.lineTo(75, -40);
    ctx.lineTo(115, -3);
    ctx.closePath();
    ctx.fill();

    // 4. 바디킷 에어로 파츠 (즉시 반영되는 실시간 튜닝)
    if (kit >= 1) {
        // 프론트 립 스포일러
        ctx.fillStyle = '#111';
        ctx.fillRect(160, 35, 40, 8);
        
        // 사이드 스커트
        ctx.fillRect(-140, 38, 280, 6);
    }

    if (kit === 1) {
        // 스트리트 스포일러
        ctx.fillStyle = '#111';
        ctx.fillRect(-200, -20, 15, 5);
        ctx.fillRect(-195, -15, 5, 15);
    } else if (kit === 2) {
        // 대형 GT 레이스 윙
        ctx.fillStyle = '#111';
        ctx.fillRect(-205, -45, 35, 6); // 윙 상단
        ctx.fillRect(-185, -39, 5, 40); // 지지대 1
        ctx.fillRect(-195, -39, 5, 40); // 지지대 2
        // 거대한 프론트 디퓨저
        ctx.fillRect(170, 38, 35, 7);
    }

    // 5. 헤드라이트 & 테일램프
    // 테일램프
    ctx.fillStyle = '#ff1111';
    ctx.fillRect(-200, 5, 10, 15);
    
    // 헤드라이트
    ctx.fillStyle = '#e6f2ff';
    ctx.beginPath();
    ctx.arc(185, 12, 8, 0, Math.PI * 2);
    ctx.fill();

    // 6. 바퀴 (휠/타이어)
    drawWheel(-130, 35);
    drawWheel(130, 35);

    ctx.restore();
}

function drawWheel(wx, wy) {
    ctx.save();
    ctx.translate(wx, wy);

    // 타이어
    ctx.fillStyle = '#1c1c1c';
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, Math.PI * 2);
    ctx.fill();

    // 휠 스포크
    ctx.fillStyle = (kit === 2) ? '#d4af37' : '#cccccc'; // 바디킷 2면 골드휠
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// 초기화 실행
update();
</script>

</body>
</html>
